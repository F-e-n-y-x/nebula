plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def githubOAuthClientId = (
        project.findProperty("githubOAuthClientId")
                ?: localProperties.getProperty("githubOAuthClientId")
                ?: System.getenv("GITHUB_OAUTH_CLIENT_ID")
                ?: ""
).toString().trim()
def escapeBuildConfigString = { value ->
    value.replace("\\", "\\\\").replace("\"", "\\\"")
}
def enableX86TestAbi = (project.findProperty("enableX86TestAbi") ?: "false").toString().toBoolean()
def nebulaAppLabel = "Nebula"
def audioHapticsSdkDir = (
        project.findProperty("audioHapticsSdkDir")
                ?: localProperties.getProperty("audioHapticsSdkDir")
                ?: System.getenv("AUDIO_HAPTICS_SDK_DIR")
                ?: ""
).toString().trim()
if (audioHapticsSdkDir.isEmpty()) {
    throw new GradleException(
            "audioHapticsSdkDir is required; point it at the Apache-2.0 audio-haptics-sdk checkout"
    )
}

android {
    ndkVersion "28.2.13676358"

    compileSdkVersion 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 22
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // minSdk 22 ≥ 21：系统原生支持 VectorDrawable，禁用为 API<21 设备生成位图
        // 回退的老管线（其栅格化器无法解析矢量里的 ?attr 主题色，Material You
        // 强调色会让它直接构建失败；这些 PNG 在 22+ 设备上本来也永远不会被用到）。
        vectorDrawables.useSupportLibrary = true

        // 记录最近一次发布的版本。发版时由 CI 依据 tag 和发布历史覆写
        // （见 .github/release/version-code.sh）。
        versionName "0.1.0"
        versionCode = 100

        // Optional GitHub OAuth App client ID. Enable Device Flow on the OAuth app,
        // then set githubOAuthClientId in local.properties, pass -PgithubOAuthClientId=...,
        // or set GITHUB_OAUTH_CLIENT_ID in the environment.
        buildConfigField "String", "GITHUB_OAUTH_CLIENT_ID", "\"${escapeBuildConfigString(githubOAuthClientId)}\""

        externalNativeBuild {
            ndkBuild {
                arguments "AUDIO_HAPTICS_SDK_DIR=${file(audioHapticsSdkDir).absolutePath.replace('\\', '/')}"
            }
        }

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        ndk {
            def supportedAbis = ['arm64-v8a', 'armeabi-v7a']
            if (enableX86TestAbi) {
                supportedAbis += 'x86'
            }
            abiFilters(*supportedAbis)
        }
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        compose = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "io.github.f_e_n_y_x.nebula.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "io.github.f_e_n_y_x.nebula"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // 启用 desugaring 以支持 Java 8+ API 在旧版 Android 上运行
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
        baseline file('lint-baseline.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    // Release signing: environment variables (CI) or a properties file kept outside the
    // repo, named by nebulaSigningProperties in local.properties or -PnebulaSigningProperties.
    def signingProps = new Properties()
    def signingPropsPath = (project.findProperty("nebulaSigningProperties")
            ?: localProperties.getProperty("nebulaSigningProperties") ?: "").toString().trim()
    if (!signingPropsPath.isEmpty() && new File(signingPropsPath).exists()) {
        new File(signingPropsPath).withInputStream { signingProps.load(it) }
    }
    def keystorePath = System.getenv("KEYSTORE_PATH") ?: signingProps.getProperty("storeFile")
    def keystorePassword = System.getenv("KEYSTORE_PASSWORD") ?: signingProps.getProperty("storePassword")
    def envKeyAlias = System.getenv("KEY_ALIAS") ?: signingProps.getProperty("keyAlias")
    def envKeyPassword = System.getenv("KEY_PASSWORD") ?: signingProps.getProperty("keyPassword")
    def hasSigningConfig = keystorePath != null && keystorePassword != null && envKeyAlias != null && envKeyPassword != null && new File(keystorePath).exists()

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Nebula (debug)"
            resValue "string", "app_label_root", "Nebula (Root, debug)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-debug.pro'
        }
        release {
            // Nebula uses its own application ID (io.github.f_e_n_y_x.nebula), so no suffix.
            resValue "string", "app_label", nebulaAppLabel
            resValue "string", "app_label_root", "Nebula (Root)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig && signingConfigs.hasProperty('release')) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
}

dependencies {
    implementation project(':engine')
    implementation project(':usbip-backend')
    // Desugaring 支持，用于在旧版 Android 上使用 Java 8+ API
    coreLibraryDesugaring libs.desugar.jdk.libs

    // Lossless Scaling Frame Generation 桥接模块（仅 arm64-v8a 设备 + Android 10+ 实际可用）。
    // 阶段 1：仅提供占位 API；阶段 2 起接入 MediaCodec 拦截路径。
    implementation project(':framegen')
    implementation project(':moonlight-haptics-android')

    implementation libs.bouncycastle.prov
    implementation libs.bouncycastle.pkix
    implementation libs.jcodec
    implementation libs.okhttp
    implementation libs.jmdns
    implementation libs.shield.controller
    implementation libs.appcompat
    implementation libs.core.splashscreen
    implementation libs.preference
    implementation libs.keyboard.header
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.glide
    implementation libs.glide.transformations
    implementation libs.cardview
    implementation libs.recyclerview
    annotationProcessor libs.glide.compiler
    implementation libs.seismic
    implementation libs.flexbox
    implementation libs.tvprovider
    implementation libs.zxing.embedded
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.compose.showcase.sequence


    // Kotlin
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.hidden.api.bypass

    testImplementation libs.junit
    testImplementation libs.json
    testImplementation libs.okhttp.tls
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.kxml2
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.espresso.core
    debugImplementation libs.androidx.compose.ui.test.manifest
}
