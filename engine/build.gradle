// :engine — Nebula's streaming engine: GameStream/Nova protocol (nvstream + moonlight-common-c JNI),
// pairing and host discovery, video/audio renderers, and the io.github.fenyx.nebula.engine facade.
// No UI: apps build their own screens on top of NebulaEngine / StreamSession.
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def audioHapticsSdkDir = (
        project.findProperty("audioHapticsSdkDir")
                ?: localProperties.getProperty("audioHapticsSdkDir")
                ?: System.getenv("AUDIO_HAPTICS_SDK_DIR")
                ?: ""
).toString().trim()
if (audioHapticsSdkDir.isEmpty()) {
    throw new GradleException("audioHapticsSdkDir is required; point it at the audio-haptics-sdk checkout")
}
def enableX86TestAbi = (project.findProperty("enableX86TestAbi") ?: "false").toString().toBoolean()

android {
    namespace 'io.github.fenyx.nebula.engine'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdk 22
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            ndkBuild {
                arguments "AUDIO_HAPTICS_SDK_DIR=${file(audioHapticsSdkDir).absolutePath.replace('\\', '/')}"
            }
        }
        ndk {
            def supportedAbis = ['arm64-v8a', 'armeabi-v7a']
            if (enableX86TestAbi) {
                supportedAbis += 'x86'
            }
            abiFilters(*supportedAbis)
            debugSymbolLevel 'FULL'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    api project(':moonlight-haptics-android')
    api libs.okhttp
    api libs.kotlinx.coroutines.android
    implementation libs.bouncycastle.prov
    implementation libs.bouncycastle.pkix
    implementation libs.jcodec
    implementation libs.jmdns
    implementation libs.gson
    implementation libs.preference
    implementation libs.kotlin.stdlib

    testImplementation libs.junit
    testImplementation libs.json
    testImplementation libs.kxml2
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.okhttp.tls
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${libs.versions.coroutines.get()}"
}
