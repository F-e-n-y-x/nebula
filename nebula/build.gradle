def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing: same key as Nebula 0.1.x (kept outside the repo), so this app updates it in place.
def signingProps = new Properties()
def signingPropsPath = (project.findProperty("nebulaSigningProperties")
        ?: localProperties.getProperty("nebulaSigningProperties") ?: "").toString().trim()
if (!signingPropsPath.isEmpty() && new File(signingPropsPath).exists()) {
    new File(signingPropsPath).withInputStream { signingProps.load(it) }
}
def keystorePath = signingProps.getProperty("storeFile")
def hasSigning = keystorePath != null && new File(keystorePath).exists()

android {
    namespace 'io.github.f_e_n_y_x.nebula'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.f_e_n_y_x.nebula"
        // 26: Navigation 3 and the current AndroidX stack need API 23+; 26 also gives adaptive icons
        // and the modern notification/foreground-service model for the stream service.
        minSdk 26
        targetSdk 35
        versionCode 309
        versionName "0.3.0-dev9.1"
        // The engine's native core ships for ARM only (x86_64 emulators run it through translation).
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystorePath)
                storePassword signingProps.getProperty("storePassword")
                keyAlias signingProps.getProperty("keyAlias")
                keyPassword signingProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

